name: Build
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # For maven project
  build:
    strategy:
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        java: [21]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: Maven Build with Java ${{ matrix.java }} on ${{ matrix.os }}
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Java ${{ matrix.java }}
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: ${{ matrix.java }}
          distribution: "temurin"
          cache: "maven"

      - name: "Build and Verify"
        run: mvn -ntp clean verify --errors

        # The following is only executed on Ubuntu on Java 21
      - name: "Codecov"
        if: matrix.os == 'ubuntu-latest' && matrix.java == 21 && github.repository == 'ASSERT-KTH/depclean'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./depclean-maven-plugin/target/site/jacoco/jacoco.xml,./depclean-core/target/site/jacoco/jacoco.xml
          flags: unittests

      # SonarCloud analysis runs via the SonarCloud GitHub app (Automatic Analysis),
      # so no CI-based sonar:sonar step is needed here.

  # --------------------------------------------------------------------------------------------------------------------
  # For Gradle module
  gradle:
    name: Gradle build with Java 21 on ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: 21
          distribution: "temurin"
          cache: "maven"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      - name: Build with maven (Building missing/local dependencies)
        run: mvn -ntp clean install -DskipTests -q

      - name: Build with Gradle
        working-directory: ./depclean-gradle-plugin
        run: ./gradlew clean publishToMavenLocal build
