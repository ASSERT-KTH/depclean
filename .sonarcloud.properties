# SonarCloud Automatic Analysis configuration.
#
# The patterns must cover the whole subtree, so each fixture root ends with /**.
# A bare directory path is not enough: it does not match the files underneath it,
# which is how the fixtures kept being analysed.
#
# These trees are input data for the integration, functional and smoke tests. They
# deliberately contain odd code (default packages, commented-out code, empty tests)
# and a Java 8 program the CI smoke job runs, so analysing them only produces noise.
sonar.exclusions=depclean-core/src/test/resources/**,depclean-maven-plugin/src/test/resources/**,depclean-maven-plugin/src/test/resources-its/**,depclean-gradle-plugin/src/test/resources-fts/**,.github/smoke/**
sonar.test.exclusions=depclean-core/src/test/resources/**,depclean-maven-plugin/src/test/resources/**,depclean-maven-plugin/src/test/resources-its/**,depclean-gradle-plugin/src/test/resources-fts/**,.github/smoke/**
