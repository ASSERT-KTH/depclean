plugins {
    id 'com.diffplug.spotless' version '8.10.1'
    id 'groovy'
    id 'jacoco'
    id 'java'
    id 'java-gradle-plugin'
    id 'jvm-test-suite'
    id 'maven-publish'
    id 'net.ltgt.errorprone' version '5.1.1'
}

java {
    // JDK 21 toolchain to run Error Prone 2.50+; bytecode/API stay at Java 17 via options.release
    toolchain {
      languageVersion.set(JavaLanguageVersion.of(21))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

// Groovy (Spock) test classes must also run on the Java 17 test launcher
tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

group = 'se.kth.castor'
version = '2.2.0-SNAPSHOT'

repositories {
  mavenLocal()
  mavenCentral()
}

ext {
    depcleanVersion = '2.2.0-SNAPSHOT'
    errorProneCoreVersion = '2.50.0'
    jspecifyVersion = '1.0.1'
    nullawayVersion = '0.14.0'
    slf4jVersion = '2.0.18'
    spockVersion = '2.4-groovy-4.0'
    spotbugsAnnotationsVersion = '4.10.4'
}

dependencies {
    implementation(gradleApi())
    implementation(gradleTestKit())
    implementation("se.kth.castor:depclean-core:${depcleanVersion}")
    implementation("se.kth.castor:depclean-maven-plugin:${depcleanVersion}")
    implementation("org.slf4j:slf4j-reload4j:${slf4jVersion}")
    compileOnly("org.jspecify:jspecify:${jspecifyVersion}")

    implementation("com.github.spotbugs:spotbugs-annotations:${spotbugsAnnotationsVersion}")

    testImplementation("org.spockframework:spock-core:${spockVersion}")

    errorprone("com.google.errorprone:error_prone_core:${errorProneCoreVersion}")
    compileOnly("com.google.errorprone:error_prone_annotations:${errorProneCoreVersion}")
    annotationProcessor("com.uber.nullaway:nullaway:${nullawayVersion}")
}

testing {
    suites {
        test {
            useSpock()
        }
    }
}

tasks.withType(Test).configureEach {
    // The functional tests run the plugin in-process, so the test JVM is the JVM
    // the plugin is verified on. -PtestJavaVersion=17|21|25 selects it (CI matrix).
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of((findProperty('testJavaVersion') ?: '21') as int)
    }
    // Show full exception detail on CI, where the HTML report is not accessible
    testLogging {
        exceptionFormat 'full'
        showExceptions true
        showCauses true
        showStackTraces true
    }
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
    }
}

spotless {
  java {
    googleJavaFormat()
  }
}

gradlePlugin {
    plugins {
        depcleanPlugin {
            id = 'se.kth.castor.depclean-gradle-plugin'
            implementationClass = 'se.kth.depclean.DepCleanGradlePlugin'
            displayName = 'DepClean Gradle Plugin'
            description = 'A plugin to analyze and debloat dependencies in Gradle projects'
        }
    }
}

import net.ltgt.gradle.errorprone.CheckSeverity

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        check("NullAway", CheckSeverity.ERROR)
        option("NullAway:AnnotatedPackages", "se.kth.depclean")
    }
}

// Reproducible archives
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
