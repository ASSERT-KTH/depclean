plugins {
    id 'com.diffplug.spotless' version '8.11.0'
    id 'groovy'
    id 'jacoco'
    id 'java'
    id 'com.gradle.plugin-publish' version '2.2.1'
    id 'jvm-test-suite'
    id 'net.ltgt.errorprone' version '5.2.0'
}

java {
    // JDK 21 toolchain to run Error Prone 2.50+; bytecode/API stay at Java 17 via options.release
    toolchain {
      languageVersion.set(JavaLanguageVersion.of(21))
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

// Groovy (Spock) test classes must also run on the Java 17 test launcher
tasks.withType(GroovyCompile).configureEach {
    sourceCompatibility = '17'
    targetCompatibility = '17'
}

group = 'se.kth.castor'
version = '2.3.1-SNAPSHOT'

repositories {
  mavenLocal()
  mavenCentral()
}

ext {
    depcleanVersion = '2.3.1-SNAPSHOT'
    errorProneCoreVersion = '2.52.0'
    gsonVersion = '2.15.0'
    jspecifyVersion = '1.0.1'
    nullawayVersion = '0.14.3'
    slf4jVersion = '2.0.20'
    spockVersion = '2.5-groovy-4.0'
    spotbugsAnnotationsVersion = '4.10.5'
}

dependencies {
    implementation(gradleApi())
    implementation("se.kth.castor:depclean-core:${depcleanVersion}")
    implementation("com.google.code.gson:gson:${gsonVersion}")
    implementation("org.slf4j:slf4j-api:${slf4jVersion}")
    compileOnly("org.jspecify:jspecify:${jspecifyVersion}")

    compileOnly("com.github.spotbugs:spotbugs-annotations:${spotbugsAnnotationsVersion}")

    testImplementation("org.spockframework:spock-core:${spockVersion}")

    errorprone("com.google.errorprone:error_prone_core:${errorProneCoreVersion}")
    compileOnly("com.google.errorprone:error_prone_annotations:${errorProneCoreVersion}")
    annotationProcessor("com.uber.nullaway:nullaway:${nullawayVersion}")
}

testing {
    suites {
        test {
            useSpock()
        }
    }
}

tasks.withType(Test).configureEach {
    // The functional tests run the plugin in-process, so the test JVM is the JVM
    // the plugin is verified on. -PtestJavaVersion=17|21|25 selects it (CI matrix).
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of((findProperty('testJavaVersion') ?: '21') as int)
    }
    // Show full exception detail on CI, where the HTML report is not accessible
    testLogging {
        exceptionFormat 'full'
        showExceptions true
        showCauses true
        showStackTraces true
    }
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco {
    toolVersion = '0.8.16'
}

tasks.named('jacocoTestReport', JacocoReport) {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
    }
}

spotless {
  java {
    // Pin the formatter version: spotless's default google-java-format may change
    // on any spotless bump, which would fail spotlessCheck on unrelated renovate PRs
    googleJavaFormat('2.0.0')
  }
}

// com.gradle.plugin-publish applies java-gradle-plugin and maven-publish, attaches the sources
// and javadoc jars, and adds the publishPlugins task that uploads to the Gradle Plugin Portal.
gradlePlugin {
    website = 'https://github.com/ASSERT-KTH/depclean'
    vcsUrl = 'https://github.com/ASSERT-KTH/depclean.git'
    plugins {
        depcleanPlugin {
            id = 'se.kth.castor.depclean-gradle-plugin'
            implementationClass = 'se.kth.depclean.DepCleanGradlePlugin'
            displayName = 'DepClean Gradle Plugin'
            description = 'Detects the unused dependencies of a Gradle project by analyzing its bytecode, and writes a debloated dependencies block'
            tags.set(['dependencies', 'dependency-analysis', 'debloat', 'unused-dependencies', 'bytecode'])
        }
    }
}

// The released plugin is built against the depclean-core release on Maven Central; mavenLocal
// only serves the SNAPSHOT of the core installed by the Maven build of this repository.
tasks.named('publishPlugins') {
    doFirst {
        if (version.toString().endsWith('-SNAPSHOT')) {
            throw new GradleException("Refusing to publish the SNAPSHOT version ${version} to the Plugin Portal")
        }
    }
}

import net.ltgt.gradle.errorprone.CheckSeverity

tasks.withType(JavaCompile).configureEach {
    options.errorprone {
        check("NullAway", CheckSeverity.ERROR)
        option("NullAway:AnnotatedPackages", "se.kth.depclean")
    }
}

// Reproducible archives
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
